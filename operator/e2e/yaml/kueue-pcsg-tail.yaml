# PodCliqueSet for Test_Kueue11_ScalingGroupTailWaitsForAnchor: a frontend plus a leader/worker
# scaling group with 3 replicas and minAvailable 1, submitted through the "grove-e2e-backlog"
# LocalQueue (kueue-queues-backlog.yaml). The anchor PodGang (frontend and replica 0) requests 60Mi
# and each tail PodGang (replicas 1 and 2) 20Mi, 100Mi in total.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-pcsg-tail
  labels:
    app: kueue-pcsg-tail
    kueue.x-k8s.io/queue-name: grove-e2e-backlog
spec:
  replicas: 1
  template:
    cliques:
      - name: frontend
        spec:
          roleName: frontend
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: frontend
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 40Mi
      - name: leader
        spec:
          roleName: leader
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: leader
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 10Mi
      - name: worker
        spec:
          roleName: worker
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 10Mi
    podCliqueScalingGroups:
      - name: sg
        replicas: 3
        minAvailable: 1
        cliqueNames:
          - leader
          - worker
