apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kai-backend-upgrade
  labels:
    kai.scheduler/queue: test
spec:
  replicas: 2
  template:
    topologyConstraint:
      topologyName: grove-topology
      pack:
        required: block
    podCliqueScalingGroups:
      - name: workers
        replicas: 2
        minAvailable: 1
        topologyConstraint:
          topologyName: grove-topology
          pack:
            required: rack
        cliqueNames:
          - worker
    cliques:
      - name: router
        topologyConstraint:
          topologyName: grove-topology
          pack:
            required: host
        spec:
          roleName: router
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            terminationGracePeriodSeconds: 5
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: router
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 10Mi
      - name: worker
        topologyConstraint:
          topologyName: grove-topology
          pack:
            required: host
        spec:
          roleName: worker
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            terminationGracePeriodSeconds: 5
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 10Mi
