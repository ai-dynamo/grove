# Workload for Coherent update e2e tests where MaxUnavailable exceeds MinAvailable.
# frontend: standalone PodClique (4 replicas, minAvailable 1, maxUnavailable 2).
# inference: PodCliqueScalingGroup (2 replicas, minAvailable 1) over prefill and decode.
# With maxUnavailable 2 greater than minAvailable 1, a coherent update keeps up to MaxUnavailable pods in
# flight at once rather than serializing on readiness.
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: workload-coherent-mu
  labels:
    app: workload-coherent-mu
spec:
  replicas: 1
  updateStrategy:
    type: Coherent
  template:
    cliques:
      - name: frontend
        labels:
          kai.scheduler/queue: test
        rollingUpdate:
          maxUnavailable: 2
          progressDeadline: 30s
        spec:
          roleName: frontend
          replicas: 4
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: frontend
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
      - name: prefill
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: prefill
          replicas: 1
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: prefill
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
      - name: decode
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: decode
          replicas: 1
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: decode
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
    podCliqueScalingGroups:
      - name: inference
        replicas: 2
        minAvailable: 1
        cliqueNames:
          - prefill
          - decode
        rollingUpdate:
          maxUnavailable: 1
          progressDeadline: 30s
