apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-topology
  labels:
    app: kueue-topology
    kueue.x-k8s.io/queue-name: grove-e2e-topology
spec:
  replicas: 1
  template:
    cliques:
      - name: worker
        topologyConstraint:
          topologyName: grove-topology
          pack:
            required: host
        spec:
          roleName: worker
          replicas: 2
          minAvailable: 2
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 1Mi
