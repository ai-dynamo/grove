# Workload for ProgressDeadline stall and corrective-update tests (RU24, RU25).
# pc-a and PCSG sg-x roll one unit at a time and surface UpdateInProgress=Unknown when a rollout
# makes no progress within the 30s ProgressDeadline.
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: workload-progressdeadline
  labels:
    app: workload-progressdeadline
spec:
  replicas: 1
  template:
    cliques:
      - name: pc-a
        labels:
          kai.scheduler/queue: test
        rollingUpdate:
          maxUnavailable: 1
          progressDeadline: 30s
        spec:
          roleName: role-a
          replicas: 2
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: pc-a
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
      - name: pc-b
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: role-b
          replicas: 1
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: pc-b
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
    podCliqueScalingGroups:
      - name: sg-x
        replicas: 2
        minAvailable: 1
        cliqueNames:
          - pc-b
        rollingUpdate:
          maxUnavailable: 1
          progressDeadline: 30s
