# Blocker for Test_Kueue11_ScalingGroupTailWaitsForAnchor: admitted first through the
# "grove-e2e-backlog" LocalQueue (kueue-queues-backlog.yaml), taking 50Mi of its 100Mi memory
# quota. The 50Mi left fits both of kueue-pcsg-tail.yaml's tail PodGangs (2 x 20Mi) but not its
# anchor (60Mi), until this PodCliqueSet is deleted mid-test.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-pcsg-tail-blocker
  labels:
    app: kueue-pcsg-tail-blocker
    kueue.x-k8s.io/queue-name: grove-e2e-backlog
spec:
  replicas: 1
  template:
    cliques:
      - name: worker
        spec:
          roleName: worker
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 50Mi
