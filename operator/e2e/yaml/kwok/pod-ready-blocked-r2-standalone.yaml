# Hold fresh standalone pods on PCS replica 2 NotReady until the caller removes this stage.
# Existing Ready pods and scaling-group pods are unaffected.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-ready-blocked-r2-standalone
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: .metadata.deletionTimestamp
        operator: DoesNotExist
      - key: .status.podIP
        operator: DoesNotExist
      - key: '.metadata.labels["grove.io/podcliqueset-replica-index"]'
        operator: In
        values:
          - "2"
      - key: '.metadata.labels["grove.io/podcliquescalinggroup"]'
        operator: DoesNotExist
  weight: 20
  delay:
    # 1h: effectively a hold. The caller removes the stage to release the pod well before this fires.
    durationMilliseconds: 3600000
  next:
    statusSubresource: status
    statusTemplate: |
      {{ $now := Now }}
      conditions:
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: Initialized
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: Ready
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: ContainersReady
      containerStatuses:
      {{ range .spec.containers }}
      - image: {{ .image | Quote }}
        name: {{ .name | Quote }}
        ready: true
        restartCount: 0
        state:
          running:
            startedAt: {{ $now | Quote }}
      {{ end }}
      hostIP: {{ NodeIPWith .spec.nodeName | Quote }}
      podIP: {{ PodIPWith .spec.nodeName ( or .spec.hostNetwork false ) ( or .metadata.uid "" ) ( or .metadata.name "" ) ( or .metadata.namespace "" ) | Quote }}
      phase: Running
      startTime: {{ $now | Quote }}
