# A standalone PodClique whose MaxUnavailable (1) is below MinAvailable (2) and whose pods are all
# unschedulable via an impossible node selector. A corrective RollingRecreate must replace both pods
# together so the PodClique's PodGang can reach MinReplicas and be admitted. A per-pod disruption budget
# below MinAvailable would replace them one at a time, leaving the PodGang permanently below MinReplicas
# and the rollout stuck. This workload exists to keep that from landing.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: workload-unavailable-standalone-gang
spec:
  replicas: 1
  updateStrategy:
    type: RollingRecreate
  template:
    terminationDelay: 1h
    cliques:
      - name: worker
        labels:
          kai.scheduler/queue: test
        rollingUpdate:
          maxUnavailable: 1
        spec:
          roleName: worker
          replicas: 2
          minAvailable: 2
          podSpec:
            schedulerName: kai-scheduler
            terminationGracePeriodSeconds: 0
            nodeSelector:
              node_role.e2e.grove.nvidia.com: agent
              e2e.grove.io/unschedulable: "true"
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 10Mi
