apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-pcsg-scale
  labels:
    app: kueue-pcsg-scale
    kueue.x-k8s.io/queue-name: grove-e2e
spec:
  replicas: 1
  template:
    cliques:
      - name: worker
        spec:
          roleName: worker
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 1Mi
    podCliqueScalingGroups:
      - name: sg-worker
        replicas: 2
        minAvailable: 2
        cliqueNames:
          - worker
