# Manual smoke test for the "kueue" scheduler backend: a single standalone clique,
# full-gang (minAvailable == replicas), admitted through the "grove-e2e" LocalQueue in
# kueue-queues.yaml. Not part of the automated e2e suite -- apply/delete by hand.
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-smoke
  labels:
    app: kueue-smoke
    kueue.x-k8s.io/queue-name: grove-e2e
spec:
  replicas: 1
  template:
    cliques:
      - name: worker
        spec:
          roleName: worker
          replicas: 2
          minAvailable: 2
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 1Mi
