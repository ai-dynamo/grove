#
# grove-e2e-low workload for Test_Kueue13_WorkloadPriorityPreemption, submitted through the
# "grove-e2e-priority" LocalQueue (kueue-queues-priority.yaml) and requesting its whole 100Mi
# memory quota (2 pods x 50Mi): admitted first, then moved in place to grove-e2e-mid, then preempted by
# kueue-workload-priority-high.yaml.
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: kueue-workload-priority-low
  labels:
    app: kueue-workload-priority-low
    kueue.x-k8s.io/queue-name: grove-e2e-priority
    kueue.x-k8s.io/priority-class: grove-e2e-low
spec:
  replicas: 1
  template:
    cliques:
      - name: worker
        spec:
          roleName: worker
          replicas: 2
          minAvailable: 2
          podSpec:
            schedulerName: kueue
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: type
                          operator: In
                          values:
                            - kwok
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/nginx:alpine-slim
                resources:
                  requests:
                    memory: 50Mi
