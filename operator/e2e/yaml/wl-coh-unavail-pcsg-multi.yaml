# Coherent corrective-update regression for #873: three PodCliqueScalingGroup replicas are all unschedulable
# while maxUnavailable=1, so the number of unavailable replicas exceeds the budget. The old readiness-delta
# budget deadlocked here. The corrective update removes the selector and the count-anchored budget replaces
# the replicas one per reconcile cycle until all three are available, rather than blocking forever.
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: wl-coh-unavail-pcsg-multi
spec:
  replicas: 1
  updateStrategy:
    type: Coherent
  template:
    terminationDelay: 1h
    podCliqueScalingGroups:
      - name: sg-x
        replicas: 3
        minAvailable: 1
        cliqueNames:
          - worker
        rollingUpdate:
          maxUnavailable: 1
    cliques:
      - name: worker
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: worker
          replicas: 1
          minAvailable: 1
          podSpec:
            schedulerName: kai-scheduler
            terminationGracePeriodSeconds: 0
            nodeSelector:
              node_role.e2e.grove.nvidia.com: agent
              e2e.grove.io/unschedulable: "true"
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: worker
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 10Mi
