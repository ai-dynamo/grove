# RollingRecreate workload for the maxUnavailable-above-template-replicas test.
#
# sg-x declares template replicas 1 and rollingUpdate.maxUnavailable 2. maxUnavailable is a ceiling on
# how many replicas a rollout disrupts at once, applied against the live replica count, so it is allowed
# to be larger than the template replica count: the live PodCliqueScalingGroup is scaled separately
# through its /scale subresource.
#
# The test scales sg-x out to 4 live replicas and checks the rollout honours the budget of 2 against the
# live count, then scales it back in to 1 and checks the rollout disrupts at most the single remaining
# replica even though maxUnavailable is still 2.
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: wl-mu-rr
  labels:
    app: wl-mu-rr
spec:
  replicas: 1
  updateStrategy:
    type: RollingRecreate
  template:
    cliques:
      - name: front
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: role-front
          replicas: 1
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: front
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
      - name: pc-b
        labels:
          kai.scheduler/queue: test
        spec:
          roleName: role-b
          replicas: 1
          minAvailable: 1
          podSpec:
            terminationGracePeriodSeconds: 5
            schedulerName: kai-scheduler
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node_role.e2e.grove.nvidia.com
                          operator: In
                          values:
                            - agent
            tolerations:
              - key: node_role.e2e.grove.nvidia.com
                operator: Equal
                value: agent
                effect: NoSchedule
            containers:
              - name: pc-b
                image: registry:5001/busybox:latest
                command: ["sleep", "infinity"]
                resources:
                  requests:
                    memory: 80Mi
    podCliqueScalingGroups:
      - name: sg-x
        replicas: 1
        minAvailable: 1
        cliqueNames:
          - pc-b
        rollingUpdate:
          maxUnavailable: 2
