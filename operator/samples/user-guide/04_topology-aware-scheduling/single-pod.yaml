apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: decode-four-gpus
  namespace: numa-locality
spec:
  spec:
    devices:
      requests:
        - name: gpus
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 4
      constraints:
        - matchAttribute: resource.kubernetes.io/numaNode
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: numa-decode
  namespace: numa-locality
spec:
  replicas: 1
  template:
    cliques:
      - name: decode
        spec:
          roleName: decode
          replicas: 1
          podSpec:
            schedulerName: default-scheduler
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: decode-four-gpus
            containers:
              - name: decode
                image: ubuntu:24.04
                command: ["sh", "-c", "nvidia-smi -L && exec sleep infinity"]
                resources:
                  claims:
                    - name: gpu
