apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ required ".Values.clusterRole.name is required" .Values.clusterRole.name }}
  labels:
{{- include "operator.clusterrole.labels" . | nindent 4 }}
rules:
- apiGroups:
  - scheduler.grove.io
  resources:
  - podgangs
  - podgangs/status
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - grove.io
  resources:
  - podcliquesets
  - podcliquesets/status
  - podcliques
  - podcliques/status
  - podcliquescalinggroups
  - clustertopologybindings
  - clustertopologybindings/status
  - podcliquescalinggroups/status
  - podgangmaps
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/status
  - serviceaccounts
  - services
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - watch
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - get
  - list
  - delete
  - deletecollection
  - patch
  - update
  - watch
{{- if include "grove.scheduler.hasProfile" (list . "kai-scheduler") }}
- apiGroups:
  - kai.scheduler
  resources:
  - topologies
  verbs:
  - create
  - get
  - list
  - watch
  - patch
  - update
  - delete
{{- end }}
{{- if include "grove.scheduler.hasProfile" (list . "kueue") }}
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - topologies
  - workloads
  verbs:
  - create
  - get
  - list
  - watch
  - patch
  - update
  - delete
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - workloadpriorityclasses
  verbs:
  - get
  - list
  - watch
{{- end }}
# DRA (Dynamic Resource Allocation) integration for resource sharing
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaimtemplates
  verbs:
  - get
  - list
  - watch
{{- if .Values.config.network.autoMNNVLEnabled }}
  - create
  - delete
  - patch
  - update
{{- end }}
{{- if include "grove.scheduler.hasProfile" (list . "kai-scheduler") }}
- apiGroups:
  - scheduling.run.ai
  resources:
  - podgroups
  verbs:
  - create
  - get
  - list
  - watch
  - patch
  - update
  - delete
{{- end }}
{{- if include "grove.scheduler.hasProfile" (list . "volcano") }}
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - podgroups
  verbs:
  - create
  - get
  - list
  - watch
  - patch
  - update
  - delete
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - queues
  verbs:
  - get
  - list
  - watch
{{- end }}
# ComputeDomain cleanup permissions are always required when the API is present, including when AutoMNNVL is disabled.
# Kubernetes permits RBAC rules for resources whose CRD is not installed.
- apiGroups:
  - resource.nvidia.com
  resources:
  - computedomains
  verbs:
  - get
  - list
  - watch
  - delete
{{- if .Values.config.network.autoMNNVLEnabled }}
  - create
  - patch
  - update
{{- end }}
# cert-controller injects the conversion webhook caBundle in auto mode.
# cert-controller watches CRDs through an informer, which cannot be restricted by name.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
# The CRD installer always patches PodCliqueSet conversion and can optionally apply all Grove CRDs.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - podcliquesets.grove.io
  - podcliques.grove.io
  - podcliquescalinggroups.grove.io
  - clustertopologies.grove.io
  - clustertopologybindings.grove.io
  - podgangmaps.grove.io
  - podgangs.scheduler.grove.io
  verbs:
  - create
  - update
  - patch
  - delete
- apiGroups:
  - grove.io
  resources:
  - clustertopologies
  verbs:
  - list
