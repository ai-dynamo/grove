version: "2"
run:
  concurrency: 4
  timeout: 10m
linters:
  enable:
    - importas
    - loggercheck
    - misspell
    - modernize
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    loggercheck:
      logr: true
      zap: true
      no-printf-like: true
    misspell:
      mode: restricted # only check comments
    modernize:
      disable:
        # omitzero would rewrite `omitempty` to `omitzero` on JSON tags, which
        # changes wire semantics (omitzero omits on the zero value, omitempty
        # on the empty value) and is not a safe mechanical modernization for
        # CRD API types.
        - omitzero
        # newexpr would rewrite `ptr.To(x)` to `new(x)`. Keep `ptr.To`: it is
        # the idiom across the Kubernetes ecosystem, `ptr.Deref` stays in use
        # regardless so k8s.io/utils/ptr does not go away, and `new(expr)`
        # mixes both styles in lines like `new(ptr.Deref(x, 0))`.
        - newexpr
    revive:
      rules:
        - name: duplicated-imports
        - name: unused-parameter
        - name: unreachable-code
        - name: context-as-argument
        - name: early-return
        - name: exported
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        text: 'SA1019:' # Excludes messages where deprecated variables are used
      - path: (.+)\.go$
        # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
        # revive:
      - path: (.+)\.go$
        text: var-naming # ((var|const|struct field|func) .* should be .*
      - path: (.+)\.go$
        text: dot-imports # should not use dot imports
      - path: (.+)\.go$
        text: package-comments # package comment should be of the form
      - path: (.+)\.go$
        text: unexported-return # exported func .* returns unexported type .*, which can be annoying to use
      - path: (.+)\.go$
        text: indent-error-flow # if block ends with a return statement, so drop this else and outdent its block
      - path: (.+)\.go$
        text: 'exported: (type|func) name will be used as .* by other packages, and that stutters;'
      - path: (.+)\.go$
        text: exported function Convert_.* should have comment or be unexported
      - path: (.+)\.go$
        text: redundant-import-alias
        # typecheck:
      - path: (.+)\.go$
        text: 'undeclared name: `.*`'
      - path: (.+)\.go$
        text: '".*" imported but not used'
    paths:
      - zz_generated\..*\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
